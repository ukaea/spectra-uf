name: Tests on pull requests and manual runs

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    name: Run tests
    # Manual runs are for feature branches only
    if: github.event_name == 'pull_request' || (github.ref_name != 'dev' && github.ref_name != 'main')
    uses: ./.github/workflows/run-tests.yml

  # One stable check name for the rulesets to require
  all-tests-passed:
    name: All tests passed
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every test job succeeded
        env:
          RESULT: ${{ needs.run-tests.result }}
        run: |
          echo "Test result: $RESULT"
          [ "$RESULT" = "success" ]