name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pylint:
    name: Pylint score and badge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Install the package itself so pylint can resolve numpy, scipy, etc.
      - name: Install package with dev dependencies
        run: pip install .[dev] pylint anybadge

      # Lint findings don't fail the job; the score is reported via the badge
      - name: Run pylint
        run: pylint spectrauf --reports=n --score=y | tee pylint-report.txt || true

      - name: Generate pylint badge
        run: |
          score=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' pylint-report.txt)
          if [ -z "$score" ]; then
            echo "::error::Could not read a pylint score. See the 'Run pylint' step output."
            exit 1
          fi
          echo "### Pylint score: $score/10" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p badges
          anybadge --value="$score" --file=badges/pylint.svg pylint

      - name: Upload pylint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.txt

      - name: Upload pylint badge
        uses: actions/upload-artifact@v4
        with:
          name: badge-pylint
          path: badges/pylint.svg