name: PR tests

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # Manual runs are for feature branches only
    if: github.event_name == 'pull_request' || (github.ref_name != 'dev' && github.ref_name != 'main')
    uses: ./.github/workflows/tests.yml

  tests-passed:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all tests succeeded
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "Test result: $RESULT"
          [ "$RESULT" = "success" ]