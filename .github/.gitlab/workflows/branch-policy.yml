name: Branch policy

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR flow (feature -> dev -> main)
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FROM_FORK" = "true" ]; then
            echo "::error::PRs from forks are not allowed."; exit 1
          fi
          if [ "$BASE" = "main" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::Only 'dev' may be merged into 'main' (got '$HEAD')."; exit 1
          fi
          if [ "$BASE" = "dev" ] && { [ "$HEAD" = "dev" ] || [ "$HEAD" = "main" ]; }; then
            echo "::error::Only feature branches may be merged into 'dev' (got '$HEAD')."; exit 1
          fi
          echo "OK: $HEAD -> $BASE"