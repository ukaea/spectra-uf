stages:
  - test
  - lint
  - coverage
  - pages

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PY310: "python:3.10-slim-bullseye"
  PY311: "python:3.11-slim-bullseye"
  PY312: "python:3.12-slim-bullseye"
  PY313: "python:3.13-slim-bullseye"

cache:
  paths:
    - .cache/pip

.test_template: &test_logic
  script:
    - pip install .[dev]
    - python -m unittest tests/testsuite.py

# -------------
# 1. Unit tests
# -------------
unit_tests:3.10:
  stage: test
  image: $PY310
  <<: *test_logic
  only:
    - main

unit_tests:3.11:
  stage: test
  image: $PY311
  <<: *test_logic
  only:
    - main

unit_tests:3.12:
  stage: test
  image: $PY312
  <<: *test_logic
  only:
    - main

unit_tests:3.13_manual:
  stage: test
  image: $PY313
  <<: *test_logic
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      when: manual
      allow_failure: false  # This makes it a "blocking" manual step
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: false

# ----------
# 2. Linting
# ----------
lint:
  stage: lint
  image: $PY313
  script:
    - pip install pylint anybadge
    - mkdir -p public
    - pylint spectrauf | tee pylint-report.txt || true
    - score=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' pylint-report.txt)
    - anybadge --value=$score --file=public/pylint.svg pylint
  artifacts:
    when: always
    paths:
      - pylint-report.txt
      - public/pylint.svg
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ----------
# 3. Coverage
# ----------
coverage:
  stage: coverage
  image: $PY313
  script:
    - pip install .[dev] coverage anybadge
    - coverage run -m unittest tests/testsuite.py
    - total=$(coverage report | tail -1 | awk '{print $4}' | sed 's/%//')
    - mkdir -p public
    - anybadge --value=$total --file=public/coverage.svg coverage
  artifacts:
    paths: [public/coverage.svg]
  only:
    - main

# ---------------
# 4. GitLab Pages
# ---------------
pages:
  stage: pages
  image: $PY313
  script:
    - pip install .[dev,docs]
    - sphinx-build -b html docs/source public
    - cp public/pylint.svg public/ || true
    - cp public/coverage.svg public/ || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"