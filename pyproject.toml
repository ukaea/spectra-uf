[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrauf"
version = "0.1.0b1"
description = "SPECTRA-UF"
readme = "README.md"
authors = [{name = "UKAEA"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["spectra", "uncertainty", "nuclear", "fusion"]   # adjust to suit
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Topic :: Scientific/Engineering",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy>=1.26.0",
  "scipy>=1.11.2",
  "matplotlib>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/ukaea/spectra-uf"
Documentation = "https://ukaea.github.io/spectra-uf/"
Issues = "https://github.com/ukaea/spectra-uf/issues"
Changelog = "https://github.com/ukaea/spectra-uf/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pylint>=3.0.0",
  "black>=24.0.0",
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "coverage>=7.0.0",
  "anybadge",
]
docs = [
  "sphinx>=7.0.0",
  "myst-parser",
  "sphinx-rtd-theme>=2.0.0",
  "sphinx_copybutton",
  "sphinx-autodoc-typehints",
]

[tool.setuptools.packages.find]
include = ["spectrauf*"]

[tool.setuptools.package-data]
spectrauf = ["data/fispact_reference_spectra/*.json", "data/*.json"]
