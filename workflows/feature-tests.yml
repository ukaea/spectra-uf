name: Feature tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Refuse to run on dev/main so they can't produce a false "tests-passed"
    if: github.ref_name != 'main' && github.ref_name != 'dev'
    uses: ./.github/workflows/tests.yml

  # Single stable check name to require in rulesets
  tests-passed:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all tests succeeded
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "Test result: $RESULT"
          [ "$RESULT" = "success" ]